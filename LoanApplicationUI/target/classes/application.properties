spring.application.name=loan-application-ui
spring.thymeleaf.cache=false
loan.json.output-dir=generated-json
# IBM ODM REST decision service
odm.rest.endpoint=${ODM_REST_ENDPOINT:http://localhost:9060/DecisionService/rest/v1/DecConfig/1.0/DecOps/1.0}
odm.rest.username=${ODM_REST_USERNAME:odmAdmin}
odm.rest.password=${ODM_REST_PASSWORD:odmAdmin}
odm.rest.decision-id=${ODM_REST_DECISION_ID:string1}
odm.rest.invoke-on-submit=${ODM_REST_INVOKE_ON_SUBMIT:true}
